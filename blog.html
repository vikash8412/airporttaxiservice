<body data-nav="/blog">
<div id="site-header"></div>

<header class="post-hero">
  <div class="container container-tight">
    <h1 class="fw-bold">Routes &amp; Travel Guides</h1>
    <p class="mb-0" style="color:#c7d2ea;max-width:640px">Practical guides to cab routes from Bangalore — what a trip costs, how long it takes, and what to know before you go.</p>
  </div>
</header>

<section>
  <div class="container container-tight">
    <div class="row g-2 mb-4">
      <div class="col-sm-8"><input id="q" class="form-control" placeholder="Search routes… e.g. Mysore, Coorg, airport"></div>
      <div class="col-sm-4"><button id="qBtn" class="btn btn-gold w-100">Search</button></div>
    </div>

    <div class="row g-3" id="postGrid"></div>

    <div class="text-center mt-4">
      <button id="moreBtn" class="btn btn-outline-navy" hidden>Load more</button>
      <div id="gridMsg" class="text-muted mt-3"></div>
    </div>
  </div>
</section>

<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/site.js"></script>
<script>
  var page = 1, q = '', loading = false;
  var grid = document.getElementById('postGrid'),
      moreBtn = document.getElementById('moreBtn'),
      msg = document.getElementById('gridMsg');

  function load(reset) {
    if (loading) return;
    loading = true;
    if (reset) { page = 1; grid.innerHTML = skeletons(6); moreBtn.hidden = true; msg.textContent = ''; }
    ATSsite.api.list({ per_page: 12, page: page, q: q }).then(function (res) {
      loading = false;
      if (reset) grid.innerHTML = '';
      if ((!res.data || !res.data.length) && page === 1) { msg.textContent = 'No guides found. Try a different search.'; return; }
      grid.insertAdjacentHTML('beforeend', res.data.map(function (p) {
        return '<div class="col-md-6 col-lg-4">' + ATSsite.postCard(p) + '</div>';
      }).join(''));
      moreBtn.hidden = !res.meta.has_more;
      page++;
    }).catch(function () {
      loading = false;
      if (reset) grid.innerHTML = '';
      msg.textContent = 'Could not load guides right now. Please try again later.';
    });
  }
  function skeletons(n) {
    var s = '';
    for (var i = 0; i < n; i++) s += '<div class="col-md-6 col-lg-4"><div class="route-card"><div class="img skeleton"></div><div class="body"><div class="skeleton" style="height:14px;width:60%;margin-bottom:8px"></div><div class="skeleton" style="height:14px;width:90%"></div></div></div></div>';
    return s;
  }
  document.getElementById('qBtn').addEventListener('click', function () { q = document.getElementById('q').value.trim(); load(true); });
  document.getElementById('q').addEventListener('keydown', function (e) { if (e.key === 'Enter') { q = this.value.trim(); load(true); } });
  moreBtn.addEventListener('click', function () { load(false); });
  load(true);
</script>
<script src="https://nammataxi.com/embed/chatbot.js" data-brand="airporttaxi" data-source="airporttaxi" defer></script>
</body>
